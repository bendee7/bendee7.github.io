<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>BendeVP — Under construction</title>
    <style>
        :root { --bg: #242629; --text: #ffffff; --muted: #9a9b9d; --accent: #35a58e; }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: var(--bg);
            color: var(--text);
            font-family: "Source Sans Pro", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }
        main { max-width: 34rem; }
        .brand {
            margin: 0 0 2.5rem;
            font-size: 0.9rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .brand strong { color: var(--text); font-weight: 600; }
        h1 {
            margin: 0 0 1rem;
            font-size: clamp(2rem, 7vw, 3.2rem);
            line-height: 1.1;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 600;
        }
        .bar {
            width: 3.5rem;
            height: 3px;
            margin: 0 auto 1.5rem;
            background: var(--accent);
            border-radius: 2px;
        }
        p { margin: 0; font-size: 1.1rem; line-height: 1.6; color: var(--muted); }
    </style>
</head>
<body>
    <main>
        <p class="brand"><strong>Virtual Photography</strong> by BendeVP</p>
        <h1>Under construction</h1>
        <div class="bar"></div>
        <p>My portfolio is on its way.<br>Please check back soon.</p>
    </main>
</body>
</html>
